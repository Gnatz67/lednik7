:root{color-scheme:dark;--bg:#070b14;--panel:#0d1526;--ink:#e3ebf6;--dim:#93a7c2;--frost:#9cc4ec;--amber:#ffd27a;--red:#d8423a;--line:#24324a}
*{box-sizing:border-box;min-width:0}

body{position:fixed;inset:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(120% 80% at 50% 0%,#10203a 0%,#070b14 60%)}

#prompt:empty{display:none}
#hud{position:absolute;font-size:13px;line-height:1.3;color:var(--ink)}
.col #hud{left:0;right:0;top:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:4px 6px}
.row #hud{top:0;right:0;bottom:0;width:206px;display:flex;flex-direction:column;gap:10px;padding:10px 8px;overflow:hidden}
.row.touch #hud{padding-bottom:var(--ctlh,0)}

#alert{height:5px;background:#18223a;border-radius:3px;overflow:hidden;max-width:220px}

@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* ================= world generation ================= */
const FLOORS=[{w:2,h:2,name:'Basement'},{w:3,h:3,name:'Ground floor'},{w:3,h:3,name:'Upper floor'}];
function genWorld(seed){
  const R=mulberry(seed*2654435761>>>0),ri=n=>Math.floor(R()*n),pick=a=>a[ri(a.length)];
  const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
  const rooms=[],edges=[],fl=[],adj=[];
  FLOORS.forEach((F,f)=>{fl.push({base:rooms.length,w:F.w,h:F.h});for(let y=0;y<F.h;y++)for(let x=0;x<F.w;x++){rooms.push({id:rooms.length,lv:f,gx:x,gy:y,edges:{t:null,r:null,b:null,l:null},nb:{t:null,r:null,b:null,l:null},up:null,down:null});adj.push([])}});
  const at=(f,x,y)=>fl[f].base+y*fl[f].w+x;
  const nbs=c=>{const r=rooms[c],F=fl[r.lv],o=[];if(r.gy>0)o.push([at(r.lv,r.gx,r.gy-1),'t']);if(r.gx<F.w-1)o.push([at(r.lv,r.gx+1,r.gy),'r']);if(r.gy<F.h-1)o.push([at(r.lv,r.gx,r.gy+1),'b']);if(r.gx>0)o.push([at(r.lv,r.gx-1,r.gy),'l']);return o};
  const other=(e,c)=>e.a===c?e.b:e.a;
  const link=(a,b,s,tree)=>{const e={a,b,lock:null,was:null,tree};edges.push(e);rooms[a].edges[s]=e;rooms[b].edges[OPP[s]]=e;rooms[a].nb[s]=b;rooms[b].nb[OPP[s]]=a;adj[a].push(e);adj[b].push(e);return e};
  const floorIds=f=>{const r=[];for(let k=0;k<fl[f].w*fl[f].h;k++)r.push(fl[f].base+k);return r};
  const depth=new Array(rooms.length).fill(0);
  const grow=root=>{const inT=new Set([root]),act=[root];depth[root]=0;while(act.length){const i=R()<.5?act.length-1:ri(act.length),c=act[i];const o=nbs(c).filter(([k])=>!inT.has(k));if(!o.length){act.splice(i,1);continue}const [k,s]=pick(o);inT.add(k);depth[k]=depth[c]+1;link(c,k,s,true);act.push(k)}};
  const bfsD=s=>{const d=new Array(rooms.length).fill(1e9);d[s]=0;const q=[s];while(q.length){const c=q.shift();for(const e of adj[c]){const o=other(e,c);if(d[o]>d[c]+1){d[o]=d[c]+1;q.push(o)}}}return d};
  const start=at(0,ri(2),1);

  for(let f=0;f<FLOORS.length;f++){
    grow(roots[f]);
    if(f<FLOORS.length-1){const ids=floorIds(f).filter(c=>c!==roots[f]).sort((a,b)=>depth[b]-depth[a]);const u=pick(ids.slice(0,Math.max(1,Math.ceil(ids.length/2))));
      const d=pick(floorIds(f+1));const e={a:u,b:d,lock:null,was:null,tree:true,stair:true};edges.push(e);adj[u].push(e);adj[d].push(e);rooms[u].up=d;rooms[d].down=u;ups.push(u);roots.push(d)}
  }
  const top=FLOORS.length-1,deg=c=>Object.values(rooms[c].edges).filter(Boolean).length;
  const leaves=floorIds(top).filter(c=>c!==roots[top]&&deg(c)===1),md=Math.max(...leaves.map(c=>depth[c]));
  const office=pick(leaves.filter(c=>depth[c]===md));
  const roofC=floorIds(top).filter(c=>c!==office&&c!==roots[top]).sort((a,b)=>depth[b]-depth[a]);
  const roof=roofC.length?pick(roofC.slice(0,3)):roots[top];
  for(let f=0;f<FLOORS.length;f++){const cand=[];for(const c of floorIds(f))for(const [k,s] of nbs(c))if(k>c&&!rooms[c].edges[s]&&c!==office&&k!==office)cand.push([c,k,s]);shuf(cand).slice(0,f===0?1:2).forEach(([c,k,s])=>link(c,k,s,false))}

  const pools=[['boiler','store','cells'],['mess','laundry','infirmary','yard','yard','hall','barracks','store','hall'],['barracks','hall','cells','infirmary','store','hall','mess','laundry']];
  for(let f=0;f<FLOORS.length;f++){const pool=shuf(pools[f].slice());for(const c of floorIds(f))if(!type[c])type[c]=pool.pop()||'hall'}

  const offE=Object.values(rooms[office].edges).find(Boolean);offE.lock='green';

  for(const rm of rooms){
    rm.type=type[rm.id];Object.assign(rm,{name:RT[rm.type].name,sign:RT[rm.type].sign,dark:RT[rm.type].dark});
    const st=[];if(rm.up!=null)st.push('up');if(rm.down!=null)st.push('down');if(rm.id===roof)st.push('roof');

  for(const col in keyRoom)putItem(keyRoom[col],'key:'+col);
  const r0=[...reach(new Set())].filter(c=>c!==start);
  putItem(start,'pistol');
  const coatR=rooms.filter(r=>(r.type==='barracks'||r.type==='laundry')&&r.id!==office).map(r=>r.id);
  putItem(coatR.length?pick(coatR):pick(r0),'coat');
  putItem(start,'stones');
  {const inf=rooms.filter(r=>r.type==='infirmary');for(const r of inf){const mc=r.cont.filter(k=>k.kind==='medcab'&&!k.item);if(mc.length)mc[0].item='gas';else putItem(r.id,'gas')}if(!inf.length)putItem(pick(rooms.filter(r=>r.lv===1)).id,'gas');putItem(pick(rooms.filter(r=>r.lv>=1&&r.id!==office)).id,'gas')}
  for(let i=0;i<5;i++)putItem(pick(rooms.filter(r=>r.id!==office)).id,'stones');
  for(const rm of rooms)for(const k of rm.cont)k.flav=pick(FLAV);
  /* guards */
  for(const rm of rooms){const [a,b]=RT[rm.type].g;let n=b;if(rm.id===start)n=1;rm.gdefs=[];for(let i=0;i<n;i++){const d=mkRoute(rm,R,ri,pick,rm.id===start);if(d)rm.gdefs.push(d)}}
  for(const rm of rooms)for(const d of rm.gdefs){const r=R();d.loot=r<.45?'darts':r<.68?'stones':r<.82?'key:'+pick(['red','blue']):r<.9&&rm.id!==start?'key:green':null;d.flav=pick(['A pack of cheap cigarettes.','A letter from home. Nothing useful.','Sunflower seeds.','A pocket comb and some kopecks.']);d.looted=false}
  const topIds=floorIds(top).filter(c=>c!==roots[top]),eliteRooms=[office,roof,...shuf(topIds.filter(c=>c!==office&&c!==roof))].filter((c,i,a)=>a.indexOf(c)===i&&c!==roots[top]).slice(0,2);
  const elites=[];for(const c of eliteRooms){const d=mkRoute(rooms[c],R,ri,pick,false);if(d){d.elite=true;d.loot=null;d.flav='';d.looted=true;elites.push({room:c,def:d})}}
  const midIds=floorIds(1).filter(c=>c!==roots[1]&&rooms[c].type!=='yard');let midElite=null;
  for(const c of shuf(midIds)){const d=mkRoute(rooms[c],R,ri,pick,false);if(d){d.elite=true;d.loot=null;d.flav='';d.looted=true;midElite={room:c,def:d};break}}
  return {seed,rooms,edges,adj,fl,start,office,roof,keyRoom,elites,midElite};
}

function buildRoom(rm,R,opt){
  for(let at=0;at<60;at++){if(tryBuild(rm,R,opt,at>=40))return}
  rm.bad=true;
}

  if(k==='KeyZ'){cycleZoom();return}
  if(S.mode!=='play'){if((k==='KeyP'||k==='Escape')&&S.mode==='pause'){e.preventDefault();startPlay()}return}
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(k))e.preventDefault();
  if(!e.repeat){if(k==='KeyE')S.actP=true;if(k==='Space')S.fireP=true;if(k==='KeyQ')S.throwP=true;if(k==='KeyG')S.gasP=true;if(k==='KeyH')S.hideP=true;if(k==='KeyP'||k==='Escape'){pause();return}}
  keys.add(k);
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>{keys.clear()});
$('bPause').addEventListener('click',()=>{initAudio();if(S.mode==='play')pause();else if(S.mode==='pause')startPlay()});
$('bMute').addEventListener('click',()=>{initAudio();setMute(!muted)});
const ZNAME={1:'whole room',2:'close camera'};
function setZoom(z){ZOOM=ZOOMS.includes(z)?z:1;store.set('lednik7_zoom2',String(ZOOM));const b=$('bZoom');b.setAttribute('aria-label','Zoom: '+ZNAME[ZOOM]+'. Tap to change.');$('zplus').style.display=ZOOM===2?'none':'';S.hsig='';camStep(0,true)}

$('bZoom').addEventListener('click',()=>{initAudio();cycleZoom()});
setZoom(parseFloat(store.get('lednik7_zoom2'))||1);
const de=document.documentElement,fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled)&&!!(de.requestFullscreen||de.webkitRequestFullscreen);
const fsNo=()=>{toast('Full screen is blocked on this page. Try Safari\'s aA menu: Hide Toolbar.',5);$('bFull').hidden=true;store.set('lednik7_nofs','1');layout()};
if(fsOK&&store.get('lednik7_nofs')!=='1')$('bFull').hidden=false;
$('bFull').addEventListener('click',()=>{initAudio();try{const cur=document.fullscreenElement||document.webkitFullscreenElement;let r;if(cur)r=(document.exitFullscreen||document.webkitExitFullscreen).call(document);else r=(de.requestFullscreen||de.webkitRequestFullscreen).call(de);if(r&&r.catch)r.catch(fsNo)}catch(e){fsNo()}});
let fsT=0;['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{fsT=performance.now();qResize()}));
function resetKnob(){S.jx=S.jy=0;S.jrun=false;S.aimV=null;tapId=null;if(typeof stk!=='undefined'){stk.mv=null;stk.aim=null}}
let tapId=null,lastTap={t:0,x:0,y:0},tapRun=false,lastSet=0;
let CTRL=store.get('lednik7_ctrl')||'sticks';
const stk={mv:null,aim:null};
function stickZone(e){if(S.mode!=='play'||FOLDED||e.pointerType==='mouse'||CTRL!=='sticks')return false;const t=e.target;if(t.closest&&(t.closest('button')||t.closest('input')||t.closest('#ov')||t.closest('#fold')))return false;return true}
document.addEventListener('pointerdown',e=>{if(!stickZone(e))return;e.preventDefault();initAudio();const left=e.clientX<innerWidth/2;
  if(left&&!stk.mv){stk.mv={id:e.pointerId,x:e.clientX,y:e.clientY};if(P.hidden)unhide()}
  else if(!left&&!stk.aim){stk.aim={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),dx:0,dy:0}}},{passive:false});
document.addEventListener('pointermove',e=>{const R0=Math.min(50,innerWidth*.06);
  if(stk.mv&&e.pointerId===stk.mv.id){let dx=(e.clientX-stk.mv.x)/R0,dy=(e.clientY-stk.mv.y)/R0;const m=Math.hypot(dx,dy);S.jrun=m>2.9;if(m>1){dx/=m;dy/=m}S.jx=m<.2?0:dx;S.jy=m<.2?0:dy;
    if(m>3.4){stk.mv.x=e.clientX-dx*R0*3.4;stk.mv.y=e.clientY-dy*R0*3.4}}
  if(stk.aim&&e.pointerId===stk.aim.id){const dx=e.clientX-stk.aim.x,dy=e.clientY-stk.aim.y,m=Math.hypot(dx,dy);stk.aim.dx=dx;stk.aim.dy=dy;if(m>18){S.aimV={x:dx/m,y:dy/m};P.ax=dx/m;P.ay=dy/m}else S.aimV=null}});
function stickEnd(e){if(stk.mv&&e.pointerId===stk.mv.id){stk.mv=null;S.jx=S.jy=0;S.jrun=false}
  if(stk.aim&&e.pointerId===stk.aim.id){const a=stk.aim,m=Math.hypot(a.dx,a.dy);stk.aim=null;
    if(S.mode==='play'&&!P.hidden){if(m>18){S.fireDir={x:a.dx/m,y:a.dy/m};S.fireP=true}else if(performance.now()-a.t<350){S.fireFace=true;S.fireP=true}}S.aimV=null}}
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,stickEnd));
function stagePt(e){const r=cv.getBoundingClientRect(),vw=LW/ZOOM,vh=LH/ZOOM;return{x:CAM.x+(e.clientX-r.left)/r.width*vw,y:CAM.y+(e.clientY-r.top)/r.height*vh}}
$('stage').addEventListener('pointerdown',e=>{if(S.mode!=='play'||FOLDED||(CTRL==='sticks'&&e.pointerType!=='mouse'))return;e.preventDefault();initAudio();const p=stagePt(e),now=performance.now();
  const hit=P.pistol&&P.darts>0&&!P.hidden?S.guards.find(g=>g.st!=='ko'&&Math.hypot(g.x-p.x,g.y+5-8*CSZ()-p.y)<8*CSZ()+5):null;
  if(hit&&hit.elite){toast("Darts won't stop the officers in red. Avoid them.");return}
  if(hit){S.shootAt=hit;S.fireP=true;lastTap={t:0,x:0,y:0};return}
  tapRun=now-lastTap.t<350&&Math.hypot(p.x-lastTap.x,p.y-lastTap.y)<24;lastTap={t:now,x:p.x,y:p.y};tapId=e.pointerId;try{$('stage').setPointerCapture(tapId)}catch(_){}setTarget(p.x,p.y,tapRun);lastSet=now});
$('stage').addEventListener('pointermove',e=>{if(e.pointerId!==tapId||S.mode!=='play')return;const now=performance.now();if(now-lastSet<120)return;lastSet=now;const p=stagePt(e);setTarget(p.x,p.y,tapRun)});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>$('stage').addEventListener(ev,e=>{if(e.pointerId===tapId)tapId=null}));
function tbtn(id,down,up){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();b.classList.add('down');try{b.setPointerCapture(e.pointerId)}catch(_){}down()});const u=()=>{b.classList.remove('down');up&&up()};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,u));b.addEventListener('contextmenu',e=>e.preventDefault())}
tbtn('tSearch',()=>{S.touchAct=true;if(S.mode==='play')S.actP=true},()=>{S.touchAct=false});
tbtn('tFire',()=>{if(S.mode==='play')S.gasP=true});
tbtn('tThrow',()=>{if(S.mode==='play')S.throwP=true});
tbtn('tHide',()=>{if(S.mode==='play')S.hideP=true});
document.addEventListener('touchmove',e=>{if(!e.target.closest||!e.target.closest('.panel'))e.preventDefault()},{passive:false});
document.addEventListener('touchstart',e=>{if(!isTouch){isTouch=true;layout();if(S.mode==='title')showTitle()}if(e.touches.length>1&&!(e.target.closest&&e.target.closest('.panel')))e.preventDefault()},{passive:false});
['gesturestart','gesturechange','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
addEventListener('pointerdown',()=>initAudio(),{capture:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause('Paused while the tab was hidden.')});

/* ================= layout ================= */
const app=$('app'),hud=$('hud'),stage=$('stage'),ctl=$('ctl');
let lastW=0,lastH=0;const FOLD_MIN=520;let FOLDED=false;
function layout(){
  const W=app.clientWidth,H=app.clientHeight;if(!W||!H)return;
  ctl.hidden=!isTouch;
  const ctlR=isTouch?Math.round(clamp(H*.26,H<480?120:150,230)):0;
  mini._sz=60;mini.style.width=mini.style.height='60px';
  app.className='col'+(isTouch?' touch':'');const hh=hud.offsetHeight;
  const sCol=Math.min((W-8)/LW,(H-hh-ctlR-10)/LH);
  const short=H<560?' short':'';
  app.className='row'+(isTouch?' touch':'')+short;app.style.setProperty('--ctlh',ctlR+'px');const hw=hud.offsetWidth;
  const sRow=Math.min((W-hw-14)/LW,(H-10)/LH);
  const mode=sRow>sCol?'row':'col';app.className=mode+(isTouch?' touch':'')+(mode==='row'?short:'');
  if(mode==='row'){const ms=clamp(Math.min(hw-16,(H-ctlR)-210),56,150);mini._sz=ms;mini.style.width=mini.style.height=ms+'px'}
  let s=Math.max(.4,mode==='row'?sRow:sCol);
  const dpr=Math.min(3,window.devicePixelRatio||1),dev=s*dpr,k=Math.floor(dev);
  if(k>=2&&k/dev>.86)s=k/dpr;
  const cw=Math.floor(LW*s),ch=Math.floor(LH*s);
  cv.style.width=cw+'px';cv.style.height=ch+'px';cv.width=Math.max(1,Math.round(cw*dpr));cv.height=Math.max(1,Math.round(ch*dpr));
  stage.style.width=cw+'px';stage.style.height=ch+'px';
  if(mode==='col'){const h2=hud.offsetHeight;let top=h2+4,ch2=ctlR;
    if(isTouch){ch2=clamp(H-top-ch,ctlR,300);top=h2+4+Math.max(0,(H-h2-4-ch-ch2)/2)}else top=h2+Math.max(4,(H-h2-ch)/2);
    stage.style.left=Math.round((W-cw)/2)+'px';stage.style.top=Math.round(top)+'px';ctl.style.height=ch2+'px';sizeCtl(ch2,W)}
  else{const hw2=hud.offsetWidth;stage.style.left=Math.round(Math.max(4,(W-hw2-cw)/2))+'px';stage.style.top=Math.round((H-ch)/2)+'px';ctl.style.height=ctlR+'px';sizeCtl(ctlR,W)}
  const fs=clamp(cw/30,12,16);$('toast').style.fontSize=fs+'px';$('prompt').style.fontSize=fs-1+'px';
  S.hsig='';drawMini();draw();updHUD();
}
function sizeCtl(h,W){const j=clamp(Math.min(h-28,W*.42),96,170),b=clamp(Math.min((h-38)/2,W*.2),50,84);ctl.style.setProperty('--j',j+'px');ctl.style.setProperty('--b',b+'px')}
/* folded outer screen = narrow in portrait or very short in landscape; anything else plays */
let foldOverride=false;
function checkFold(){const f=!foldOverride&&(innerWidth<FOLD_MIN||innerHeight<330);if(f){pause('Paused while folded.');keys.clear();S.touchAct=false;resetKnob()}if(f!==FOLDED){FOLDED=f;$('fold').hidden=!f;app.inert=f;ov.inert=f;app.setAttribute('aria-hidden',String(f));ov.setAttribute('aria-hidden',String(f))}}
function onResize(){checkFold();const w=innerWidth,h=innerHeight;if(lastW){const dw=Math.abs(w-lastW)/lastW,dh=Math.abs(h-lastH)/lastH,swap=Math.abs(w-lastH)<60&&Math.abs(h-lastW)<60;if((dw>.22||dh>.22)&&!swap&&performance.now()-fsT>1500)pause('The screen changed size (fold or unfold), so the game paused.')}lastW=w;lastH=h;layout()}
let rz=0;const qResize=()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(onResize)};
addEventListener('resize',qResize);addEventListener('orientationchange',()=>setTimeout(qResize,120));
if(window.visualViewport)visualViewport.addEventListener('resize',qResize);
try{new ResizeObserver(qResize).observe(app)}catch(e){}

/* ================= main loop ================= */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S.mode==='play')update(dt);
  if(S.msgT>0){S.msgT-=dt;if(S.msgT<=0)$('toast').classList.remove('on')}
  if(!RM&&S.room&&S.room.outdoor)for(const s of S.snow){s.y+=s.vy*dt;s.x+=Math.sin(now/900+s.ph)*6*dt;if(s.y>LH){s.y=-2;s.x=Math.random()*LW}}
  camStep(dt,false);draw();updHUD();
  requestAnimationFrame(loop);
}
setDiff(parseInt(store.get('lednik7_diff'),10)||6);
setMute(muted);
newRun(rndSeed(),'title');
lastW=innerWidth;lastH=innerHeight;
layout();showTitle();checkFold();
$('foldAnyway').addEventListener('click',()=>{foldOverride=true;checkFold();layout()});
requestAnimationFrame(loop);
window.__L={genWorld,verifyWorld,S,get P(){return P},newRun,layout,enterRoom};
}
